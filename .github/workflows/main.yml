name: main Vision Android APK

# This workflow is intentionally generic: it does not reference any
# specific Python filenames. It just packages whatever source files
# exist in the repo root (main.py, plugins/, config.py, etc.) according
# to buildozer.spec. Adding, renaming, or removing source files never
# requires editing this file.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake build-essential \
            ccache libltdl-dev

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug
        env:
          # Prevents buildozer from ever pausing on an interactive prompt
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Locate built APK
        id: locate_apk
        run: |
          APK_PATH=$(find . -name "*-debug.apk" -o -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload APK artifact
        if: steps.locate_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: vision-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vision-build-logs
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/logs/*
          if-no-files-found: ignore
          retention-days: 7
